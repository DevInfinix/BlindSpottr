name: blindspottr_mobile
description: "Tesla-Style 3D Telemetry & Blind-Spot Monitoring Mobile Application for BlindSpottr"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.1
  flutter_inappwebview: ^6.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - web/threejs/
    - assets/
